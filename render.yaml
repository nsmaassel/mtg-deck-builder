services:
  - type: web
    name: mtg-deck-builder
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: "*"
      # Optional: Set ANTHROPIC_API_KEY in Render dashboard for AI explanations
      # - key: ANTHROPIC_API_KEY
      #   sync: false
    healthCheckPath: /health
    autoDeploy: true