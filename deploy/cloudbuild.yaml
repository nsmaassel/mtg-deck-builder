# Builds the image from the repository's Dockerfile. Run through deploy/2-deploy.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--build-arg', 'DATA_DATE=${_DATA_DATE}', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
# The data stage downloads Scryfall's bulk files and Commander Spellbook's variants.
timeout: 1800s
